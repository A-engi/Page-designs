<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>RF Atlas Shell v0.1.0</title>

  <style>
    :root {
      --ink: #071627;
      --navy: #071a2f;
      --navy-2: #09213c;
      --navy-3: #0d2b4a;
      --cream: #f7ecd4;
      --cream-2: #fff8e9;
      --gold: #f3c76c;
      --gold-2: #ffe29b;
      --line: rgba(243, 199, 108, 0.42);
      --soft-line: rgba(12, 30, 50, 0.12);
      --text: #102033;
      --muted: rgba(255, 255, 255, 0.72);
      --green: #14813a;
      --blue: #0d5db9;
      --purple: #77269c;
      --shadow: 0 22px 60px rgba(2, 9, 20, 0.32);
      --radius-xl: 30px;
      --radius-lg: 22px;
      --radius-md: 16px;
      --bottom-nav-height: 96px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
      background:
        radial-gradient(circle at 50% 0%, rgba(24, 80, 128, 0.25), transparent 42%),
        linear-gradient(180deg, #031020 0%, #06172a 42%, #04111f 100%);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
    }

    .phone {
      width: min(100vw, 430px);
      min-height: 100svh;
      position: relative;
      overflow: hidden;
      background:
        linear-gradient(180deg, rgba(7, 21, 39, 0.98) 0 282px, transparent 282px),
        radial-gradient(circle at 50% 18%, rgba(255, 226, 155, 0.08), transparent 30%),
        var(--cream-2);
      border: 1px solid rgba(243, 199, 108, 0.34);
      box-shadow: var(--shadow);
      isolation: isolate;
    }

    .phone::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.42;
      background-image:
        radial-gradient(circle at 18% 12%, rgba(243, 199, 108, 0.12) 0 1px, transparent 1px),
        radial-gradient(circle at 82% 18%, rgba(255, 255, 255, 0.07) 0 1px, transparent 1px),
        linear-gradient(110deg, transparent 0 42%, rgba(255, 255, 255, 0.04) 48%, transparent 54%);
      background-size: 34px 34px, 47px 47px, 100% 100%;
      mix-blend-mode: screen;
    }

    .top-shell {
      position: sticky;
      top: 0;
      z-index: 10;
      padding: calc(env(safe-area-inset-top) + 14px) 14px 18px;
      color: white;
      background:
        radial-gradient(circle at 48% 0%, rgba(255, 216, 139, 0.15), transparent 34%),
        linear-gradient(180deg, #071a2f 0%, #081a2e 60%, #061425 100%);
      border-bottom: 1px solid rgba(243, 199, 108, 0.32);
      border-radius: 0 0 28px 28px;
      box-shadow: 0 18px 36px rgba(3, 10, 20, 0.32);
    }

    .brand-row {
      min-height: 68px;
      display: grid;
      grid-template-columns: 56px 1fr 56px;
      align-items: center;
      gap: 10px;
    }

    .icon-button {
      width: 54px;
      height: 54px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.02)),
        rgba(8, 25, 45, 0.94);
      color: var(--gold-2);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.12),
        0 12px 26px rgba(0, 0, 0, 0.18);
      display: grid;
      place-items: center;
      border: 0;
      cursor: pointer;
    }

    .icon-button svg {
      width: 28px;
      height: 28px;
      stroke-width: 2.7;
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-width: 0;
      text-align: left;
    }

    .brand-mark {
      width: 44px;
      height: 44px;
      flex: 0 0 auto;
      color: var(--gold);
      filter: drop-shadow(0 4px 12px rgba(243, 199, 108, 0.24));
    }

    .brand-title {
      margin: 0;
      color: #fffdf7;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(31px, 9.8vw, 44px);
      letter-spacing: 0.055em;
      line-height: 0.9;
      text-shadow: 0 2px 0 rgba(0, 0, 0, 0.18);
      white-space: nowrap;
    }

    .brand-subtitle {
      margin: 6px 0 0;
      color: var(--gold-2);
      font-size: clamp(12px, 3.5vw, 15px);
      font-weight: 600;
      letter-spacing: 0.012em;
      white-space: nowrap;
    }

    .search-shell {
      margin-top: 14px;
      height: 58px;
      display: grid;
      grid-template-columns: 42px 1fr 44px;
      align-items: center;
      gap: 8px;
      padding: 0 12px 0 15px;
      border: 1px solid rgba(243, 199, 108, 0.42);
      border-radius: 20px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.075), rgba(255, 255, 255, 0.025)),
        rgba(8, 24, 43, 0.93);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.12),
        0 14px 30px rgba(0, 0, 0, 0.2);
    }

    .search-shell svg {
      color: rgba(255, 255, 255, 0.94);
    }

    .search-shell input {
      width: 100%;
      border: 0;
      outline: 0;
      background: transparent;
      color: white;
      font: inherit;
      font-size: 16px;
      font-weight: 520;
      min-width: 0;
    }

    .search-shell input::placeholder {
      color: rgba(255, 255, 255, 0.72);
    }

    .filter-button {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 14px;
      color: var(--gold-2);
      background: transparent;
      cursor: pointer;
    }

    .quick-access {
      margin-top: 14px;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
    }

    .quick-chip {
      min-width: 0;
      height: 64px;
      border: 1px solid rgba(255, 255, 255, 0.17);
      border-radius: 18px;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-weight: 830;
      font-size: clamp(14px, 4vw, 18px);
      letter-spacing: 0.02em;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.18),
        0 12px 24px rgba(0, 0, 0, 0.22);
      border-bottom-color: rgba(0, 0, 0, 0.32);
      cursor: pointer;
      overflow: hidden;
    }

    .quick-chip svg {
      width: 27px;
      height: 27px;
      flex: 0 0 auto;
    }

    .quick-chip.is-dtt {
      background:
        radial-gradient(circle at 25% 18%, rgba(255, 255, 255, 0.18), transparent 42%),
        linear-gradient(135deg, #1d9b48, #0b562c);
      border-color: rgba(93, 255, 133, 0.35);
    }

    .quick-chip.is-dab {
      background:
        radial-gradient(circle at 25% 18%, rgba(255, 255, 255, 0.18), transparent 42%),
        linear-gradient(135deg, #127de4, #093a7e);
      border-color: rgba(83, 176, 255, 0.42);
    }

    .quick-chip.is-fm {
      background:
        radial-gradient(circle at 25% 18%, rgba(255, 255, 255, 0.2), transparent 42%),
        linear-gradient(135deg, #9a32bd, #4a176b);
      border-color: rgba(234, 124, 255, 0.4);
    }

    .quick-chip.is-more {
      background:
        radial-gradient(circle at 25% 18%, rgba(255, 255, 255, 0.12), transparent 42%),
        linear-gradient(135deg, #142c49, #081a2e);
      border-color: rgba(243, 199, 108, 0.34);
      font-weight: 760;
    }

    .content-canvas {
      position: relative;
      z-index: 1;
      min-height: calc(100svh - 282px);
      padding: 20px 14px calc(var(--bottom-nav-height) + env(safe-area-inset-bottom) + 22px);
      background:
        radial-gradient(circle at 50% 28%, rgba(255, 255, 255, 0.72), transparent 38%),
        linear-gradient(180deg, #fff8e9 0%, #f6ead2 100%);
    }

    .content-canvas::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0.3;
      background-image:
        linear-gradient(25deg, transparent 0 37%, rgba(66, 44, 18, 0.10) 37.2%, transparent 37.8%),
        linear-gradient(143deg, transparent 0 58%, rgba(66, 44, 18, 0.08) 58.2%, transparent 58.9%),
        radial-gradient(circle at 18% 28%, rgba(33, 90, 120, 0.055), transparent 18%),
        radial-gradient(circle at 82% 56%, rgba(33, 90, 120, 0.05), transparent 20%);
      filter: blur(0.2px);
    }

    .blank-hint {
      position: relative;
      min-height: 52svh;
      border: 1px dashed rgba(10, 31, 54, 0.14);
      border-radius: 24px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.38), rgba(255, 255, 255, 0.12));
      display: grid;
      place-items: center;
      color: rgba(16, 32, 51, 0.35);
      text-align: center;
      font-weight: 750;
      letter-spacing: 0.03em;
    }

    .bottom-shell {
      position: fixed;
      left: 50%;
      bottom: 0;
      z-index: 20;
      width: min(100vw, 430px);
      transform: translateX(-50%);
      padding: 8px 10px calc(env(safe-area-inset-bottom) + 8px);
      background:
        linear-gradient(180deg, rgba(7, 22, 39, 0), rgba(7, 22, 39, 0.86) 18%, #061425 100%);
    }

    .bottom-nav {
      height: var(--bottom-nav-height);
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 2px;
      border: 1px solid rgba(243, 199, 108, 0.42);
      border-radius: 26px;
      background:
        radial-gradient(circle at 50% 0%, rgba(255, 217, 133, 0.14), transparent 34%),
        linear-gradient(180deg, #0b2139, #061625);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.12),
        0 -8px 28px rgba(4, 10, 18, 0.3);
      overflow: hidden;
    }

    .nav-item {
      position: relative;
      min-width: 0;
      border: 0;
      background: transparent;
      color: rgba(255, 255, 255, 0.84);
      display: grid;
      place-items: center;
      align-content: center;
      gap: 7px;
      font: inherit;
      font-size: 12px;
      font-weight: 680;
      cursor: pointer;
    }

    .nav-item::after {
      content: "";
      position: absolute;
      right: 0;
      top: 16px;
      bottom: 16px;
      width: 1px;
      background: rgba(243, 199, 108, 0.16);
    }

    .nav-item:last-child::after,
    .nav-item.is-active::after,
    .nav-item:has(+ .is-active)::after {
      display: none;
    }

    .nav-item svg {
      width: 27px;
      height: 27px;
      stroke-width: 2.2;
    }

    .nav-item.is-active {
      color: var(--gold-2);
      margin: -1px 0;
      border: 1px solid rgba(255, 223, 130, 0.8);
      border-radius: 24px;
      background:
        radial-gradient(circle at 50% 102%, rgba(255, 190, 47, 0.5), transparent 32%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.015));
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.18),
        0 0 24px rgba(255, 199, 75, 0.35);
      transform: translateY(-4px);
    }

    .nav-item.is-active::before {
      content: "";
      position: absolute;
      top: 5px;
      left: 50%;
      width: 38px;
      height: 3px;
      transform: translateX(-50%);
      border-radius: 99px;
      background: linear-gradient(90deg, transparent, var(--gold-2), transparent);
      box-shadow: 0 0 12px rgba(255, 224, 150, 0.9);
    }

    @media (max-width: 380px) {
      .brand-row {
        grid-template-columns: 50px 1fr 32px;
      }

      .icon-button {
        width: 50px;
        height: 50px;
      }

      .brand {
        gap: 8px;
      }

      .brand-mark {
        width: 38px;
        height: 38px;
      }

      .quick-chip {
        height: 58px;
        gap: 5px;
      }

      .quick-chip svg {
        width: 23px;
        height: 23px;
      }

      .bottom-nav {
        height: 88px;
      }

      :root {
        --bottom-nav-height: 88px;
      }
    }
  </style>
</head>

<body>
  <main class="phone" aria-label="RF Atlas app shell">
    <header class="top-shell">
      <section class="brand-row" aria-label="App header">
        <button class="icon-button" type="button" aria-label="Open menu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
            <path d="M4 7h16M4 12h16M4 17h16" stroke-linecap="round" />
          </svg>
        </button>

        <div class="brand" aria-label="RF Atlas">
          <svg class="brand-mark" viewBox="0 0 48 48" fill="none" stroke="currentColor" aria-hidden="true">
            <path d="M24 19v24M17 43l7-24 7 24M15 31h18M19 22h10" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
            <circle cx="24" cy="15" r="4" stroke-width="2.4" />
            <path d="M14 16a12 12 0 0 1 0-12M34 4a12 12 0 0 1 0 12M8 20a20 20 0 0 1 0-20M40 0a20 20 0 0 1 0 20" stroke-width="2.4" stroke-linecap="round" />
          </svg>

          <div>
            <h1 class="brand-title">RF ATLAS</h1>
            <p class="brand-subtitle">Your radio network companion</p>
          </div>
        </div>

        <span aria-hidden="true"></span>
      </section>

      <form class="search-shell" role="search" aria-label="Search sites, paths and services">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
          <circle cx="11" cy="11" r="7" stroke-width="2.3" />
          <path d="m16.5 16.5 4 4" stroke-width="2.3" stroke-linecap="round" />
        </svg>

        <input type="search" placeholder="Search sites, paths, services..." aria-label="Search" />

        <button class="filter-button" type="button" aria-label="Open filters">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
            <path d="M4 7h16M4 12h16M4 17h16" stroke-width="2" stroke-linecap="round" />
            <circle cx="9" cy="7" r="2" fill="currentColor" stroke="none" />
            <circle cx="15" cy="12" r="2" fill="currentColor" stroke="none" />
            <circle cx="11" cy="17" r="2" fill="currentColor" stroke="none" />
          </svg>
        </button>
      </form>

      <nav class="quick-access" aria-label="Quick access">
        <button class="quick-chip is-dtt" type="button">
          <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" aria-hidden="true">
            <path d="M16 14v15M11 29l5-15 5 15M10 20h12" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
            <circle cx="16" cy="10" r="3" stroke-width="2.2" />
            <path d="M8 11a8 8 0 0 1 0-8M24 3a8 8 0 0 1 0 8" stroke-width="2.2" stroke-linecap="round" />
          </svg>
          <span>DTT</span>
        </button>

        <button class="quick-chip is-dab" type="button">
          <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" aria-hidden="true">
            <path d="M3 17h5l3-7 5 16 4-18 4 9h5" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <span>DAB</span>
        </button>

        <button class="quick-chip is-fm" type="button">
          <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" aria-hidden="true">
            <circle cx="16" cy="16" r="8" stroke-width="2.5" />
          </svg>
          <span>FM</span>
        </button>

        <button class="quick-chip is-more" type="button">
          <svg viewBox="0 0 32 32" fill="currentColor" aria-hidden="true">
            <circle cx="9" cy="16" r="2.5" />
            <circle cx="16" cy="16" r="2.5" />
            <circle cx="23" cy="16" r="2.5" />
          </svg>
          <span>More</span>
        </button>
      </nav>
    </header>

    <section class="content-canvas" aria-label="Content canvas">
      <div class="blank-hint">CONTENT AREA</div>
    </section>

    <footer class="bottom-shell">
      <nav class="bottom-nav" aria-label="Primary navigation">
        <button class="nav-item" type="button" aria-label="Map">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
            <path d="M3 6.5 9 4l6 2.5 6-2.5v13.5L15 20l-6-2.5L3 20V6.5Z" stroke-linejoin="round" />
            <path d="M9 4v13.5M15 6.5V20" />
          </svg>
          <span>Map</span>
        </button>

        <button class="nav-item" type="button" aria-label="Sites">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
            <path d="M4 11.5 12 5l8 6.5V20H6v-8" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M10 20v-6h4v6" stroke-linejoin="round" />
          </svg>
          <span>Sites</span>
        </button>

        <button class="nav-item is-active" type="button" aria-label="RF, selected" aria-current="page">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
            <path d="M12 10v11M8 21l4-11 4 11M8.5 16h7" stroke-linecap="round" stroke-linejoin="round" />
            <circle cx="12" cy="7" r="2.25" />
            <path d="M6.5 8a6 6 0 0 1 0-6M17.5 2a6 6 0 0 1 0 6M3.5 10a10 10 0 0 1 0-10M20.5 0a10 10 0 0 1 0 10" stroke-linecap="round" />
          </svg>
          <span>RF</span>
        </button>

        <button class="nav-item" type="button" aria-label="Network">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
            <circle cx="6" cy="6" r="2.2" />
            <circle cx="18" cy="6" r="2.2" />
            <circle cx="6" cy="18" r="2.2" />
            <circle cx="18" cy="18" r="2.2" />
            <circle cx="12" cy="12" r="2.2" />
            <path d="M7.7 7.7 10.3 10.3M16.3 7.7 13.7 10.3M7.7 16.3 10.3 13.7M16.3 16.3 13.7 13.7" />
          </svg>
          <span>Network</span>
        </button>

        <button class="nav-item" type="button" aria-label="Tools">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
            <path d="M14.5 5.5a5 5 0 0 0 6 6L10 22 4 16 14.5 5.5Z" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M6.5 17.5 8.5 19.5" stroke-linecap="round" />
          </svg>
          <span>Tools</span>
        </button>
      </nav>
    </footer>
  </main>
</body>
</html>
