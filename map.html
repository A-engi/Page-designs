<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>RF Atlas Map</title>
  <link rel="stylesheet" href="shell.css" />
  <link rel="stylesheet" href="page.css" />
</head>

<body>
  <main class="phone" data-page="map" data-nav="map" data-version="0.1.35">
    <section class="content-canvas" aria-label="RF Atlas Map content">
      <article class="page-content">
        <header class="page-head">
          <div class="page-kicker">Map mode</div>
          <h1 class="page-title">Network Map</h1>
          <p class="page-lede">Prototype map body with sample markers and future overlay controls.</p>
        </header>

        <section class="card map-card">
          <span class="pin" style="left:22%;top:28%;">TX</span>
          <span class="pin" style="left:62%;top:42%;">RF</span>
          <span class="pin" style="left:42%;top:72%;">DAB</span>
        </section>

        <section class="card">
          <h2 class="card-title">Loaded regions</h2>
          <div class="metric-grid">
            <div class="metric"><strong>11</strong><span>Regions</span></div>
            <div class="metric"><strong>24</strong><span>Sites</span></div>
            <div class="metric"><strong>18</strong><span>Paths</span></div>
          </div>
        </section>
      </article>
    </section>
  </main>

  <script src="shell.js"></script>
</body>
</html>
