<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>RF Atlas Shell v0.1.5</title>

  <style>
    :root {
      --page-width: 430px;

      /* Closer to the original concept: cleaner blue/navy, less black */
      --navy-950: #041426;
      --navy-900: #071c33;
      --navy-850: #0a2440;
      --navy-800: #102e50;
      --navy-700: #183a61;

      /* Slightly less yellow than v0.1.4 */
      --cream-50: #fffaf0;
      --cream-100: #f8efd9;
      --cream-200: #ead8ad;

      --gold: #edbf63;
      --gold-soft: #ffdda0;
      --gold-line: rgba(237, 191, 99, 0.42);

      /* Muted to match the original generated design more closely */
      --green: #16733a;
      --green-dark: #0d4d2a;
      --blue: #0f5fab;
      --blue-dark: #0a3975;
      --purple: #733091;
      --purple-dark: #491962;

      --top-shell-height: 160px;
      --bottom-nav-height: 58px;
      --bottom-lift: 10px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at 50% 0%, rgba(38, 104, 156, 0.20), transparent 42%),
        linear-gradient(180deg, #031020 0%, #06172a 46%, #04111f 100%);
      color: #102033;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      overflow-x: hidden;
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 0;
      appearance: none;
      -webkit-appearance: none;
      cursor: pointer;
    }

    svg {
      display: block;
      flex: 0 0 auto;
    }

    .phone {
      position: relative;
      width: min(100vw, var(--page-width));
      min-height: 100dvh;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 50% 38%, rgba(255,255,255,0.76), transparent 38%),
        linear-gradient(180deg, var(--cream-50) 0%, var(--cream-100) 100%);
      border-inline: 1px solid rgba(237, 191, 99, 0.18);
      box-shadow: 0 22px 60px rgba(2, 9, 20, 0.32);
      isolation: isolate;
    }

    .phone::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      opacity: 0.22;
      background-image:
        linear-gradient(25deg, transparent 0 37%, rgba(66, 44, 18, 0.08) 37.2%, transparent 37.8%),
        linear-gradient(143deg, transparent 0 58%, rgba(66, 44, 18, 0.06) 58.2%, transparent 58.9%),
        radial-gradient(circle at 18% 28%, rgba(33, 90, 120, 0.048), transparent 18%),
        radial-gradient(circle at 82% 56%, rgba(33, 90, 120, 0.044), transparent 20%);
    }

    .top-shell {
      position: sticky;
      top: 0;
      z-index: 10;
      height: var(--top-shell-height);
      padding: 7px 10px 9px;
      color: #fff;
      background:
        radial-gradient(circle at 52% -12%, rgba(255, 222, 158, 0.14), transparent 36%),
        linear-gradient(180deg, var(--navy-850) 0%, var(--navy-900) 64%, #061626 100%);
      border-bottom: 1px solid rgba(237, 191, 99, 0.30);
      border-radius: 0 0 21px 21px;
      box-shadow: 0 14px 30px rgba(3, 10, 20, 0.30);
    }

    .brand-row {
      height: 39px;
      display: grid;
      grid-template-columns: 38px minmax(0, 1fr) 38px;
      align-items: center;
      gap: 7px;
    }

    .menu-button {
      width: 38px;
      height: 38px;
      border-radius: 13px;
      display: grid;
      place-items: center;
      color: var(--gold-soft);
      background:
        linear-gradient(180deg, rgba(255,255,255,0.075), rgba(255,255,255,0.018)),
        rgba(8, 28, 50, 0.92);
      border: 1px solid rgba(237, 191, 99, 0.40);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.10),
        0 8px 18px rgba(0,0,0,0.16);
    }

    .menu-button svg {
      width: 22px;
      height: 22px;
      stroke-width: 2.8;
    }

    .brand {
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      overflow: hidden;
    }

    .brand-mark {
      width: 28px;
      height: 28px;
      color: var(--gold);
      filter: drop-shadow(0 3px 8px rgba(237, 191, 99, 0.22));
    }

    .brand-copy {
      min-width: 0;
    }

    .brand-title {
      margin: 0;
      color: #fffdf7;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(21px, 6.1vw, 27px);
      line-height: 0.92;
      letter-spacing: 0.04em;
      white-space: nowrap;
      text-shadow: 0 2px 0 rgba(0,0,0,0.16);
    }

    .brand-subtitle {
      margin: 3px 0 0;
      color: var(--gold-soft);
      font-size: clamp(9.5px, 2.65vw, 11px);
      font-weight: 640;
      line-height: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .search-shell {
      margin-top: 8px;
      height: 40px;
      display: grid;
      grid-template-columns: 27px minmax(0, 1fr) 31px;
      align-items: center;
      gap: 7px;
      padding: 0 8px 0 12px;
      border-radius: 15px;
      color: #fff;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.075), rgba(255,255,255,0.022)),
        rgba(10, 32, 56, 0.94);
      border: 1px solid rgba(237, 191, 99, 0.38);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.10),
        0 9px 20px rgba(0,0,0,0.16);
    }

    .search-icon {
      width: 24px;
      height: 24px;
      color: rgba(255,255,255,0.94);
    }

    .search-shell input {
      width: 100%;
      min-width: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: #fff;
      font-size: clamp(12px, 3.35vw, 14px);
      font-weight: 540;
    }

    .search-shell input::placeholder {
      color: rgba(255,255,255,0.70);
    }

    .filter-button {
      width: 31px;
      height: 31px;
      display: grid;
      place-items: center;
      border-radius: 11px;
      background: transparent;
      color: var(--gold-soft);
    }

    .filter-button svg {
      width: 22px;
      height: 22px;
    }

    .quick-access {
      margin-top: 8px;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 6px;
    }

    .quick-chip {
      min-width: 0;
      height: 42px;
      padding: 0 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      border-radius: 14px;
      color: #fff;
      font-size: clamp(12px, 3.45vw, 14.5px);
      font-weight: 820;
      letter-spacing: 0.018em;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.16),
        0 8px 18px rgba(0,0,0,0.20);
      overflow: hidden;
    }

    .quick-chip svg {
      width: 20px;
      height: 20px;
    }

    .quick-chip span {
      white-space: nowrap;
      min-width: 0;
    }

    .quick-chip.is-dtt {
      background:
        radial-gradient(circle at 25% 18%, rgba(255,255,255,0.16), transparent 42%),
        linear-gradient(135deg, var(--green), var(--green-dark));
      border: 1px solid rgba(90, 226, 126, 0.28);
    }

    .quick-chip.is-dab {
      background:
        radial-gradient(circle at 25% 18%, rgba(255,255,255,0.16), transparent 42%),
        linear-gradient(135deg, var(--blue), var(--blue-dark));
      border: 1px solid rgba(80, 165, 240, 0.34);
    }

    .quick-chip.is-fm {
      background:
        radial-gradient(circle at 25% 18%, rgba(255,255,255,0.18), transparent 42%),
        linear-gradient(135deg, var(--purple), var(--purple-dark));
      border: 1px solid rgba(210, 112, 236, 0.32);
    }

    .quick-chip.is-more {
      background:
        radial-gradient(circle at 25% 18%, rgba(255,255,255,0.10), transparent 42%),
        linear-gradient(135deg, #183350, #0b1d33);
      border: 1px solid rgba(237, 191, 99, 0.30);
      font-weight: 740;
    }

    .content-canvas {
      position: relative;
      z-index: 1;
      min-height: calc(100dvh - var(--top-shell-height));
      padding: 12px 10px calc(var(--bottom-nav-height) + var(--bottom-lift) + 16px);
    }

    .blank-canvas {
      min-height: calc(100dvh - var(--top-shell-height) - var(--bottom-nav-height) - var(--bottom-lift) - 30px);
      border-radius: 21px;
      background:
        radial-gradient(circle at 50% 34%, rgba(255,255,255,0.36), transparent 48%);
    }

    .bottom-shell {
      position: fixed;
      left: 50%;
      bottom: var(--bottom-lift);
      z-index: 20;
      width: min(100vw, var(--page-width));
      transform: translateX(-50%);
      padding: 0 10px;
      pointer-events: none;
    }

    .bottom-shell::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: calc(var(--bottom-lift) * -1);
      height: 92px;
      z-index: -1;
      background:
        linear-gradient(180deg, rgba(7, 22, 39, 0), rgba(7, 22, 39, 0.72) 44%, #061425 100%);
      pointer-events: none;
    }

    .bottom-nav {
      height: var(--bottom-nav-height);
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 1px;
      border-radius: 20px;
      overflow: hidden;
      pointer-events: auto;
      background:
        radial-gradient(circle at 50% 0%, rgba(255,217,133,0.11), transparent 34%),
        linear-gradient(180deg, #0d2540, #07182a);
      border: 1px solid rgba(237, 191, 99, 0.38);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.10),
        0 -6px 21px rgba(4, 10, 18, 0.30);
    }

    .nav-item {
      position: relative;
      min-width: 0;
      display: grid;
      place-items: center;
      align-content: center;
      gap: 3px;
      background: transparent;
      color: rgba(255,255,255,0.84);
      font-size: 9.5px;
      font-weight: 700;
    }

    .nav-item::after {
      content: "";
      position: absolute;
      right: 0;
      top: 13px;
      bottom: 13px;
      width: 1px;
      background: rgba(237, 191, 99, 0.13);
    }

    .nav-item:last-child::after,
    .nav-item.is-active::after {
      display: none;
    }

    .nav-item svg {
      width: 20px;
      height: 20px;
      stroke-width: 2.2;
    }

    .nav-item.is-active {
      margin: -1px 0;
      color: var(--gold-soft);
      border-radius: 18px;
      border: 1px solid rgba(255, 223, 130, 0.74);
      background:
        radial-gradient(circle at 50% 104%, rgba(255, 190, 47, 0.34), transparent 36%),
        linear-gradient(180deg, rgba(255,255,255,0.07), rgba(255,255,255,0.012));
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.15),
        0 0 17px rgba(255, 199, 75, 0.24);
      transform: translateY(-2px);
    }

    .nav-item.is-active::before {
      content: "";
      position: absolute;
      top: 4px;
      left: 50%;
      width: 30px;
      height: 2px;
      transform: translateX(-50%);
      border-radius: 99px;
      background: linear-gradient(90deg, transparent, var(--gold-soft), transparent);
      box-shadow: 0 0 8px rgba(255, 224, 150, 0.72);
    }

    @media (max-width: 390px) {
      :root {
        --top-shell-height: 154px;
        --bottom-nav-height: 56px;
        --bottom-lift: 9px;
      }

      .top-shell {
        padding: 7px 9px 8px;
        border-radius: 0 0 20px 20px;
      }

      .brand-row {
        height: 37px;
        grid-template-columns: 37px minmax(0, 1fr) 37px;
      }

      .menu-button {
        width: 36px;
        height: 36px;
        border-radius: 12px;
      }

      .menu-button svg {
        width: 21px;
        height: 21px;
      }

      .brand-mark {
        width: 26px;
        height: 26px;
      }

      .brand-title {
        font-size: clamp(20px, 5.8vw, 25px);
      }

      .brand-subtitle {
        font-size: 9.5px;
      }

      .search-shell {
        height: 39px;
        margin-top: 7px;
      }

      .quick-access {
        margin-top: 7px;
        gap: 5px;
      }

      .quick-chip {
        height: 40px;
        padding-inline: 5px;
        gap: 4px;
      }

      .quick-chip svg {
        width: 18px;
        height: 18px;
      }

      .quick-chip.is-more {
        font-size: 12px;
      }

      .bottom-shell {
        padding-inline: 9px;
      }

      .bottom-nav {
        border-radius: 18px;
      }

      .nav-item {
        font-size: 9px;
      }

      .nav-item svg {
        width: 19px;
        height: 19px;
      }
    }
  </style>
</head>

<body>
  <main class="phone" aria-label="RF Atlas app shell" data-version="0.1.5">
    <header class="top-shell">
      <section class="brand-row" aria-label="App header">
        <button class="menu-button" type="button" aria-label="Open menu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
            <path d="M4 7h16M4 12h16M4 17h16" stroke-linecap="round" />
          </svg>
        </button>

        <div class="brand" aria-label="RF Atlas">
          <svg class="brand-mark" viewBox="0 0 48 48" fill="none" stroke="currentColor" aria-hidden="true">
            <path d="M24 19v24M17 43l7-24 7 24M15 31h18M19 22h10" stroke-width="2.55" stroke-linecap="round" stroke-linejoin="round" />
            <circle cx="24" cy="15" r="4" stroke-width="2.55" />
            <path d="M14 16a12 12 0 0 1 0-12M34 4a12 12 0 0 1 0 12M8 20a20 20 0 0 1 0-20M40 0a20 20 0 0 1 0 20" stroke-width="2.55" stroke-linecap="round" />
          </svg>

          <div class="brand-copy">
            <h1 class="brand-title">RF ATLAS</h1>
            <p class="brand-subtitle">Your radio network companion</p>
          </div>
        </div>

        <span aria-hidden="true"></span>
      </section>

      <form class="search-shell" role="search" aria-label="Search sites, paths and services">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
          <circle cx="11" cy="11" r="7" stroke-width="2.3" />
          <path d="m16.5 16.5 4 4" stroke-width="2.3" stroke-linecap="round" />
        </svg>

        <input type="search" placeholder="Search sites, paths, services..." aria-label="Search" />

        <button class="filter-button" type="button" aria-label="Open filters">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
            <path d="M4 7h16M4 12h16M4 17h16" stroke-width="2" stroke-linecap="round" />
            <circle cx="9" cy="7" r="2" fill="currentColor" stroke="none" />
            <circle cx="15" cy="12" r="2" fill="currentColor" stroke="none" />
            <circle cx="11" cy="17" r="2" fill="currentColor" stroke="none" />
          </svg>
        </button>
      </form>

      <nav class="quick-access" aria-label="Quick access">
        <button class="quick-chip is-dtt" type="button">
          <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" aria-hidden="true">
            <path d="M16 14v15M11 29l5-15 5 15M10 20h12" stroke-width="2.45" stroke-linecap="round" stroke-linejoin="round" />
            <circle cx="16" cy="10" r="3" stroke-width="2.45" />
            <path d="M8 11a8 8 0 0 1 0-8M24 3a8 8 0 0 1 0 8" stroke-width="2.45" stroke-linecap="round" />
          </svg>
          <span>DTT</span>
        </button>

        <button class="quick-chip is-dab" type="button">
          <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" aria-hidden="true">
            <path d="M3 17h5l3-7 5 16 4-18 4 9h5" stroke-width="2.45" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <span>DAB</span>
        </button>

        <button class="quick-chip is-fm" type="button">
          <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" aria-hidden="true">
            <circle cx="16" cy="16" r="8" stroke-width="2.75" />
          </svg>
          <span>FM</span>
        </button>

        <button class="quick-chip is-more" type="button">
          <svg viewBox="0 0 32 32" fill="currentColor" aria-hidden="true">
            <circle cx="9" cy="16" r="2.5" />
            <circle cx="16" cy="16" r="2.5" />
            <circle cx="23" cy="16" r="2.5" />
          </svg>
          <span>More</span>
        </button>
      </nav>
    </header>

    <section class="content-canvas" aria-label="Content canvas">
      <div class="blank-canvas" aria-hidden="true"></div>
    </section>

    <footer class="bottom-shell">
      <nav class="bottom-nav" aria-label="Primary navigation">
        <button class="nav-item" type="button" aria-label="Map">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
            <path d="M3 6.5 9 4l6 2.5 6-2.5v13.5L15 20l-6-2.5L3 20V6.5Z" stroke-linejoin="round" />
            <path d="M9 4v13.5M15 6.5V20" />
          </svg>
          <span>Map</span>
        </button>

        <button class="nav-item" type="button" aria-label="Sites">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
            <path d="M4 11.5 12 5l8 6.5V20H6v-8" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M10 20v-6h4v6" stroke-linejoin="round" />
          </svg>
          <span>Sites</span>
        </button>

        <button class="nav-item is-active" type="button" aria-label="RF, selected" aria-current="page">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
            <path d="M12 10v11M8 21l4-11 4 11M8.5 16h7" stroke-linecap="round" stroke-linejoin="round" />
            <circle cx="12" cy="7" r="2.25" />
            <path d="M6.5 8a6 6 0 0 1 0-6M17.5 2a6 6 0 0 1 0 6M3.5 10a10 10 0 0 1 0-10M20.5 0a10 10 0 0 1 0 10" stroke-linecap="round" />
          </svg>
          <span>RF</span>
        </button>

        <button class="nav-item" type="button" aria-label="Network">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
            <circle cx="6" cy="6" r="2.2" />
            <circle cx="18" cy="6" r="2.2" />
            <circle cx="6" cy="18" r="2.2" />
            <circle cx="18" cy="18" r="2.2" />
            <circle cx="12" cy="12" r="2.2" />
            <path d="M7.7 7.7 10.3 10.3M16.3 7.7 13.7 10.3M7.7 16.3 10.3 13.7M16.3 16.3 13.7 13.7" />
          </svg>
          <span>Network</span>
        </button>

        <button class="nav-item" type="button" aria-label="Tools">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
            <path d="M14.5 5.5a5 5 0 0 0 6 6L10 22 4 16 14.5 5.5Z" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M6.5 17.5 8.5 19.5" stroke-linecap="round" />
          </svg>
          <span>Tools</span>
        </button>
      </nav>
    </footer>
  </main>
</body>
</html>
