<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>RF Atlas Shell v0.1.4</title>

  <style>
    :root {
      --page-width: 430px;

      --navy-950: #031020;
      --navy-900: #061426;
      --navy-850: #071a2f;
      --navy-800: #0a213a;
      --navy-700: #102d4c;

      --cream-50: #fff9ec;
      --cream-100: #fbf0d8;
      --cream-200: #f3dfb8;

      --gold: #f3c76c;
      --gold-soft: #ffe3a4;
      --gold-line: rgba(243, 199, 108, 0.46);

      --green: #16813b;
      --blue: #1268c7;
      --purple: #7d2ba3;

      --top-shell-height: 178px;
      --bottom-nav-height: 68px;
      --bottom-lift: 10px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at 50% 0%, rgba(36, 104, 160, 0.22), transparent 42%),
        linear-gradient(180deg, #031020 0%, #06172a 46%, #04111f 100%);
      color: #102033;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      overflow-x: hidden;
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 0;
      appearance: none;
      -webkit-appearance: none;
      cursor: pointer;
    }

    svg {
      display: block;
      flex: 0 0 auto;
    }

    .phone {
      position: relative;
      width: min(100vw, var(--page-width));
      min-height: 100dvh;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 50% 38%, rgba(255,255,255,0.72), transparent 38%),
        linear-gradient(180deg, var(--cream-50) 0%, var(--cream-100) 100%);
      border-inline: 1px solid rgba(243, 199, 108, 0.2);
      box-shadow: 0 22px 60px rgba(2, 9, 20, 0.32);
      isolation: isolate;
    }

    .phone::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      opacity: 0.24;
      background-image:
        linear-gradient(25deg, transparent 0 37%, rgba(66, 44, 18, 0.10) 37.2%, transparent 37.8%),
        linear-gradient(143deg, transparent 0 58%, rgba(66, 44, 18, 0.08) 58.2%, transparent 58.9%),
        radial-gradient(circle at 18% 28%, rgba(33, 90, 120, 0.055), transparent 18%),
        radial-gradient(circle at 82% 56%, rgba(33, 90, 120, 0.05), transparent 20%);
    }

    .top-shell {
      position: sticky;
      top: 0;
      z-index: 10;
      height: var(--top-shell-height);
      padding: 8px 11px 10px;
      color: #fff;
      background:
        radial-gradient(circle at 52% -16%, rgba(255, 226, 155, 0.18), transparent 36%),
        linear-gradient(180deg, var(--navy-850) 0%, #071729 64%, #051322 100%);
      border-bottom: 1px solid rgba(243, 199, 108, 0.34);
      border-radius: 0 0 23px 23px;
      box-shadow: 0 16px 34px rgba(3, 10, 20, 0.34);
    }

    .brand-row {
      height: 44px;
      display: grid;
      grid-template-columns: 42px minmax(0, 1fr) 42px;
      align-items: center;
      gap: 8px;
    }

    .menu-button {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      color: var(--gold-soft);
      background:
        linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02)),
        rgba(8, 25, 45, 0.94);
      border: 1px solid rgba(243, 199, 108, 0.44);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.12),
        0 10px 22px rgba(0,0,0,0.18);
    }

    .menu-button svg {
      width: 24px;
      height: 24px;
      stroke-width: 2.8;
    }

    .brand {
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      overflow: hidden;
    }

    .brand-mark {
      width: 31px;
      height: 31px;
      color: var(--gold);
      filter: drop-shadow(0 4px 10px rgba(243, 199, 108, 0.24));
    }

    .brand-copy {
      min-width: 0;
    }

    .brand-title {
      margin: 0;
      color: #fffdf7;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(23px, 6.5vw, 30px);
      line-height: 0.92;
      letter-spacing: 0.04em;
      white-space: nowrap;
      text-shadow: 0 2px 0 rgba(0,0,0,0.18);
    }

    .brand-subtitle {
      margin: 4px 0 0;
      color: var(--gold-soft);
      font-size: clamp(10px, 2.8vw, 12px);
      font-weight: 650;
      line-height: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .search-shell {
      margin-top: 9px;
      height: 44px;
      display: grid;
      grid-template-columns: 30px minmax(0, 1fr) 34px;
      align-items: center;
      gap: 8px;
      padding: 0 8px 0 13px;
      border-radius: 16px;
      color: #fff;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.025)),
        rgba(8, 24, 43, 0.94);
      border: 1px solid rgba(243, 199, 108, 0.44);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.12),
        0 11px 24px rgba(0,0,0,0.18);
    }

    .search-icon {
      width: 26px;
      height: 26px;
      color: rgba(255,255,255,0.94);
    }

    .search-shell input {
      width: 100%;
      min-width: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: #fff;
      font-size: clamp(13px, 3.6vw, 15px);
      font-weight: 540;
    }

    .search-shell input::placeholder {
      color: rgba(255,255,255,0.72);
    }

    .filter-button {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      background: transparent;
      color: var(--gold-soft);
    }

    .filter-button svg {
      width: 24px;
      height: 24px;
    }

    .quick-access {
      margin-top: 9px;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 7px;
    }

    .quick-chip {
      min-width: 0;
      height: 48px;
      padding: 0 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border-radius: 15px;
      color: #fff;
      font-size: clamp(13px, 3.7vw, 16px);
      font-weight: 830;
      letter-spacing: 0.02em;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.19),
        0 10px 21px rgba(0,0,0,0.22);
      overflow: hidden;
    }

    .quick-chip svg {
      width: 22px;
      height: 22px;
    }

    .quick-chip span {
      white-space: nowrap;
      min-width: 0;
    }

    .quick-chip.is-dtt {
      background:
        radial-gradient(circle at 25% 18%, rgba(255,255,255,0.18), transparent 42%),
        linear-gradient(135deg, #1d9b48, #0b562c);
      border: 1px solid rgba(93, 255, 133, 0.34);
    }

    .quick-chip.is-dab {
      background:
        radial-gradient(circle at 25% 18%, rgba(255,255,255,0.18), transparent 42%),
        linear-gradient(135deg, #127de4, #093a7e);
      border: 1px solid rgba(83, 176, 255, 0.42);
    }

    .quick-chip.is-fm {
      background:
        radial-gradient(circle at 25% 18%, rgba(255,255,255,0.2), transparent 42%),
        linear-gradient(135deg, #9a32bd, #4a176b);
      border: 1px solid rgba(234, 124, 255, 0.4);
    }

    .quick-chip.is-more {
      background:
        radial-gradient(circle at 25% 18%, rgba(255,255,255,0.12), transparent 42%),
        linear-gradient(135deg, #142c49, #081a2e);
      border: 1px solid rgba(243, 199, 108, 0.34);
      font-weight: 760;
    }

    .content-canvas {
      position: relative;
      z-index: 1;
      min-height: calc(100dvh - var(--top-shell-height));
      padding: 13px 11px calc(var(--bottom-nav-height) + var(--bottom-lift) + 18px);
    }

    .blank-canvas {
      min-height: calc(100dvh - var(--top-shell-height) - var(--bottom-nav-height) - var(--bottom-lift) - 35px);
      border-radius: 22px;
      background:
        radial-gradient(circle at 50% 34%, rgba(255,255,255,0.34), transparent 48%);
    }

    .bottom-shell {
      position: fixed;
      left: 50%;
      bottom: var(--bottom-lift);
      z-index: 20;
      width: min(100vw, var(--page-width));
      transform: translateX(-50%);
      padding: 0 11px;
      pointer-events: none;
    }

    .bottom-shell::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: calc(var(--bottom-lift) * -1);
      height: 108px;
      z-index: -1;
      background:
        linear-gradient(180deg, rgba(7, 22, 39, 0), rgba(7, 22, 39, 0.78) 42%, #061425 100%);
      pointer-events: none;
    }

    .bottom-nav {
      height: var(--bottom-nav-height);
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 1px;
      border-radius: 22px;
      overflow: hidden;
      pointer-events: auto;
      background:
        radial-gradient(circle at 50% 0%, rgba(255,217,133,0.14), transparent 34%),
        linear-gradient(180deg, #0b2139, #061625);
      border: 1px solid rgba(243, 199, 108, 0.42);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.12),
        0 -7px 24px rgba(4, 10, 18, 0.32);
    }

    .nav-item {
      position: relative;
      min-width: 0;
      display: grid;
      place-items: center;
      align-content: center;
      gap: 4px;
      background: transparent;
      color: rgba(255,255,255,0.86);
      font-size: 10.5px;
      font-weight: 700;
    }

    .nav-item::after {
      content: "";
      position: absolute;
      right: 0;
      top: 14px;
      bottom: 14px;
      width: 1px;
      background: rgba(243, 199, 108, 0.14);
    }

    .nav-item:last-child::after,
    .nav-item.is-active::after {
      display: none;
    }

    .nav-item svg {
      width: 23px;
      height: 23px;
      stroke-width: 2.25;
    }

    .nav-item.is-active {
      margin: -1px 0;
      color: var(--gold-soft);
      border-radius: 20px;
      border: 1px solid rgba(255, 223, 130, 0.82);
      background:
        radial-gradient(circle at 50% 104%, rgba(255, 190, 47, 0.5), transparent 35%),
        linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.015));
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.18),
        0 0 22px rgba(255, 199, 75, 0.32);
      transform: translateY(-3px);
    }

    .nav-item.is-active::before {
      content: "";
      position: absolute;
      top: 4px;
      left: 50%;
      width: 34px;
      height: 3px;
      transform: translateX(-50%);
      border-radius: 99px;
      background: linear-gradient(90deg, transparent, var(--gold-soft), transparent);
      box-shadow: 0 0 10px rgba(255, 224, 150, 0.88);
    }

    @media (max-width: 390px) {
      :root {
        --top-shell-height: 170px;
        --bottom-nav-height: 64px;
        --bottom-lift: 9px;
      }

      .top-shell {
        padding: 7px 10px 9px;
        border-radius: 0 0 22px 22px;
      }

      .brand-row {
        height: 42px;
        grid-template-columns: 41px minmax(0, 1fr) 41px;
      }

      .menu-button {
        width: 40px;
        height: 40px;
        border-radius: 13px;
      }

      .brand-mark {
        width: 29px;
        height: 29px;
      }

      .brand-title {
        font-size: clamp(22px, 6.1vw, 28px);
      }

      .brand-subtitle {
        font-size: 10px;
      }

      .search-shell {
        height: 42px;
        margin-top: 8px;
      }

      .quick-access {
        margin-top: 8px;
        gap: 6px;
      }

      .quick-chip {
        height: 45px;
        padding-inline: 5px;
        gap: 5px;
      }

      .quick-chip svg {
        width: 20px;
        height: 20px;
      }

      .quick-chip.is-more {
        font-size: 13px;
      }

      .bottom-shell {
        padding-inline: 10px;
      }

      .bottom-nav {
        border-radius: 20px;
      }

      .nav-item {
        font-size: 10px;
      }

      .nav-item svg {
        width: 22px;
        height: 22px;
      }
    }
  </style>
</head>

<body>
  <main class="phone" aria-label="RF Atlas app shell" data-version="0.1.4">
    <header class="top-shell">
      <section class="brand-row" aria-label="App header">
        <button class="menu-button" type="button" aria-label="Open menu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
            <path d="M4 7h16M4 12h16M4 17h16" stroke-linecap="round" />
          </svg>
        </button>

        <div class="brand" aria-label="RF Atlas">
          <svg class="brand-mark" viewBox="0 0 48 48" fill="none" stroke="currentColor" aria-hidden="true">
            <path d="M24 19v24M17 43l7-24 7 24M15 31h18M19 22h10" stroke-width="2.55" stroke-linecap="round" stroke-linejoin="round" />
            <circle cx="24" cy="15" r="4" stroke-width="2.55" />
            <path d="M14 16a12 12 0 0 1 0-12M34 4a12 12 0 0 1 0 12M8 20a20 20 0 0 1 0-20M40 0a20 20 0 0 1 0 20" stroke-width="2.55" stroke-linecap="round" />
          </svg>

          <div class="brand-copy">
            <h1 class="brand-title">RF ATLAS</h1>
            <p class="brand-subtitle">Your radio network companion</p>
          </div>
        </div>

        <span aria-hidden="true"></span>
      </section>

      <form class="search-shell" role="search" aria-label="Search sites, paths and services">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
          <circle cx="11" cy="11" r="7" stroke-width="2.3" />
          <path d="m16.5 16.5 4 4" stroke-width="2.3" stroke-linecap="round" />
        </svg>

        <input type="search" placeholder="Search sites, paths, services..." aria-label="Search" />

        <button class="filter-button" type="button" aria-label="Open filters">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
            <path d="M4 7h16M4 12h16M4 17h16" stroke-width="2" stroke-linecap="round" />
            <circle cx="9" cy="7" r="2" fill="currentColor" stroke="none" />
            <circle cx="15" cy="12" r="2" fill="currentColor" stroke="none" />
            <circle cx="11" cy="17" r="2" fill="currentColor" stroke="none" />
          </svg>
        </button>
      </form>

      <nav class="quick-access" aria-label="Quick access">
        <button class="quick-chip is-dtt" type="button">
          <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" aria-hidden="true">
            <path d="M16 14v15M11 29l5-15 5 15M10 20h12" stroke-width="2.45" stroke-linecap="round" stroke-linejoin="round" />
            <circle cx="16" cy="10" r="3" stroke-width="2.45" />
            <path d="M8 11a8 8 0 0 1 0-8M24 3a8 8 0 0 1 0 8" stroke-width="2.45" stroke-linecap="round" />
          </svg>
          <span>DTT</span>
        </button>

        <button class="quick-chip is-dab" type="button">
          <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" aria-hidden="true">
            <path d="M3 17h5l3-7 5 16 4-18 4 9h5" stroke-width="2.45" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <span>DAB</span>
        </button>

        <button class="quick-chip is-fm" type="button">
          <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" aria-hidden="true">
            <circle cx="16" cy="16" r="8" stroke-width="2.75" />
          </svg>
          <span>FM</span>
        </button>

        <button class="quick-chip is-more" type="button">
          <svg viewBox="0 0 32 32" fill="currentColor" aria-hidden="true">
            <circle cx="9" cy="16" r="2.5" />
            <circle cx="16" cy="16" r="2.5" />
            <circle cx="23" cy="16" r="2.5" />
          </svg>
          <span>More</span>
        </button>
      </nav>
    </header>

    <section class="content-canvas" aria-label="Content canvas">
      <div class="blank-canvas" aria-hidden="true"></div>
    </section>

    <footer class="bottom-shell">
      <nav class="bottom-nav" aria-label="Primary navigation">
        <button class="nav-item" type="button" aria-label="Map">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
            <path d="M3 6.5 9 4l6 2.5 6-2.5v13.5L15 20l-6-2.5L3 20V6.5Z" stroke-linejoin="round" />
            <path d="M9 4v13.5M15 6.5V20" />
          </svg>
          <span>Map</span>
        </button>

        <button class="nav-item" type="button" aria-label="Sites">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
            <path d="M4 11.5 12 5l8 6.5V20H6v-8" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M10 20v-6h4v6" stroke-linejoin="round" />
          </svg>
          <span>Sites</span>
        </button>

        <button class="nav-item is-active" type="button" aria-label="RF, selected" aria-current="page">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
            <path d="M12 10v11M8 21l4-11 4 11M8.5 16h7" stroke-linecap="round" stroke-linejoin="round" />
            <circle cx="12" cy="7" r="2.25" />
            <path d="M6.5 8a6 6 0 0 1 0-6M17.5 2a6 6 0 0 1 0 6M3.5 10a10 10 0 0 1 0-10M20.5 0a10 10 0 0 1 0 10" stroke-linecap="round" />
          </svg>
          <span>RF</span>
        </button>

        <button class="nav-item" type="button" aria-label="Network">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
            <circle cx="6" cy="6" r="2.2" />
            <circle cx="18" cy="6" r="2.2" />
            <circle cx="6" cy="18" r="2.2" />
            <circle cx="18" cy="18" r="2.2" />
            <circle cx="12" cy="12" r="2.2" />
            <path d="M7.7 7.7 10.3 10.3M16.3 7.7 13.7 10.3M7.7 16.3 10.3 13.7M16.3 16.3 13.7 13.7" />
          </svg>
          <span>Network</span>
        </button>

        <button class="nav-item" type="button" aria-label="Tools">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
            <path d="M14.5 5.5a5 5 0 0 0 6 6L10 22 4 16 14.5 5.5Z" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M6.5 17.5 8.5 19.5" stroke-linecap="round" />
          </svg>
          <span>Tools</span>
        </button>
      </nav>
    </footer>
  </main>
</body>
</html>
