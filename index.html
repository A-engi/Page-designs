<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>RF Atlas Shell v0.1.16</title>

  <style>
    :root {
      --page-width: 430px;

      --navy-top: #09213b;
      --navy-mid: #071a30;
      --navy-low: #051321;
      --shell-gap-blue: #06182b;
      --navy-outline: rgba(42, 67, 93, 0.72);

      --cream-top: #fffaf0;
      --cream-bottom: #f7ecd4;

      --gold: #edbf63;
      --gold-soft: #ffdda0;
      --gold-border: rgba(237, 191, 99, 0.78);

      --green: #15733a;
      --green-dark: #0d4d2a;
      --blue: #0f5fab;
      --blue-dark: #0a3975;
      --purple: #733091;
      --purple-dark: #491962;

      --top-shell-height: 138px;
      --bottom-nav-height: 50px;
      --bottom-lift: 8px;
      --content-gap: 10px;
      --content-radius: 20px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
      color: #102033;
      background:
        radial-gradient(circle at 50% 0%, rgba(38, 104, 156, 0.20), transparent 42%),
        linear-gradient(180deg, #031020 0%, #06172a 46%, #04111f 100%);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      overflow-x: hidden;
    }

    button,
    input {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
    }

    svg {
      display: block;
      flex: 0 0 auto;
    }

    .phone {
      position: relative;
      width: min(100vw, var(--page-width));
      min-height: 100dvh;
      overflow-x: hidden;
      isolation: isolate;
      background:
        radial-gradient(circle at 50% 0%, rgba(255, 222, 158, 0.08), transparent 34%),
        linear-gradient(180deg, var(--shell-gap-blue) 0%, var(--navy-low) 100%);
      box-shadow: 0 22px 60px rgba(2, 9, 20, 0.32);
    }

    .top-shell {
      position: fixed;
      top: 0;
      left: 50%;
      z-index: 40;
      width: min(100vw, var(--page-width));
      height: var(--top-shell-height);
      padding: 6px 9px var(--content-gap);
      transform: translateX(-50%);
      color: #fff;
      background:
        radial-gradient(circle at 52% -12%, rgba(255, 222, 158, 0.13), transparent 38%),
        linear-gradient(180deg, var(--navy-top) 0%, var(--navy-mid) 62%, var(--navy-low) 100%);
      border-bottom: 1px solid rgba(237, 191, 99, 0.18);
      box-shadow: 0 12px 26px rgba(3, 10, 20, 0.24);
    }

    .top-shell::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: -18px;
      height: 18px;
      pointer-events: none;
      background: linear-gradient(180deg, rgba(3, 10, 20, 0.24), rgba(3, 10, 20, 0));
    }

    .brand-row {
      height: 35px;
      display: grid;
      grid-template-columns: 35px minmax(0, 1fr) 35px;
      align-items: center;
      gap: 6px;
    }

    .menu-button {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      color: var(--gold-soft);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.058), rgba(255, 255, 255, 0.014)),
        rgba(8, 28, 50, 0.90);
      border: 1px solid var(--navy-outline);
      border-radius: 8px;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.085),
        0 7px 15px rgba(0, 0, 0, 0.16);
    }

    .menu-button svg {
      width: 20px;
      height: 20px;
      stroke-width: 2.75;
    }

    .brand {
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      overflow: hidden;
    }

    .brand-mark {
      width: 25px;
      height: 25px;
      color: var(--gold);
      filter: drop-shadow(0 3px 8px rgba(237, 191, 99, 0.20));
    }

    .brand-copy {
      min-width: 0;
    }

    .brand-title {
      margin: 0;
      color: #fffdf7;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(20px, 5.65vw, 25px);
      line-height: 0.92;
      letter-spacing: 0.035em;
      white-space: nowrap;
      text-shadow: 0 2px 0 rgba(0, 0, 0, 0.15);
    }

    .brand-subtitle {
      margin: 2px 0 0;
      color: var(--gold-soft);
      font-size: clamp(8.5px, 2.45vw, 10px);
      font-weight: 640;
      line-height: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .search-shell {
      height: 36px;
      margin-top: 7px;
      padding: 0 7px 0 11px;
      display: grid;
      grid-template-columns: 24px minmax(0, 1fr) 28px;
      align-items: center;
      gap: 7px;
      color: #fff;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.064), rgba(255, 255, 255, 0.018)),
        rgba(10, 32, 56, 0.94);
      border: 1px solid var(--navy-outline);
      border-radius: 10px;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.08),
        0 8px 18px rgba(0, 0, 0, 0.15);
    }

    .search-symbol {
      width: 22px;
      height: 22px;
      position: relative;
      display: block;
    }

    .search-symbol::before {
      content: "";
      position: absolute;
      left: 2px;
      top: 2px;
      width: 12px;
      height: 12px;
      border: 3px solid rgba(255, 255, 255, 0.94);
      border-radius: 50%;
    }

    .search-symbol::after {
      content: "";
      position: absolute;
      left: 15px;
      top: 15px;
      width: 9px;
      height: 3px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.94);
      transform: rotate(45deg);
      transform-origin: left center;
    }

    .search-shell input {
      width: 100%;
      min-width: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: #fff;
      font-size: clamp(11.5px, 3.15vw, 13px);
      font-weight: 500;
      letter-spacing: 0.005em;
    }

    .search-shell input::placeholder {
      color: rgba(255, 255, 255, 0.70);
    }

    .filter-button {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      color: var(--gold-soft);
      background: transparent;
      border-radius: 8px;
    }

    .filter-button svg {
      width: 20px;
      height: 20px;
    }

    .quick-access {
      margin-top: 6px;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 5px;
    }

    .quick-chip {
      min-width: 0;
      height: 38px;
      padding: 0 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      color: #fff;
      border-radius: 8px;
      font-size: clamp(11.5px, 3.25vw, 13.5px);
      font-weight: 760;
      letter-spacing: 0.01em;
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.12),
        0 7px 16px rgba(0, 0, 0, 0.17);
      overflow: hidden;
